
name: Build Genesis Plus GX for Wii

on:
  push:
    branches:
      - main
      - korean-rom-filenames
    paths:
      - 'Makefile.wii'
      - 'core/**'
      - 'gx/**'
      - '.github/workflows/build-wii.yml'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate Hangul font data
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-nanum
          fc-cache -f
          python3 tools/gen_hangul_font.py

      - name: Build Wii DOL
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            devkitpro/devkitppc:20241116 \
            bash -lc 'make -f Makefile.wii'

      - name: Upload Wii build
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-Plus-GX-Wii-Original
          path: genplus_wii.dol
          if-no-files-found: error
